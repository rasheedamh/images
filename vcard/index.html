<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Abdullah Rasheed</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7; color: #1d1d1f;
    }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
    main { text-align: center; padding: 2rem; max-width: 22rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    p { margin: 0 0 1.5rem; opacity: .7; }
    .btn {
      display: block; padding: 1rem 1.25rem; border-radius: 14px; text-decoration: none;
      font-size: 1.1rem; font-weight: 600; background: #0071e3; color: #fff;
    }
    small { display: block; margin-top: 1rem; opacity: .55; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <h1>Abdullah Rasheed</h1>
    <p>Flutter Developer · stc</p>
    <!-- Plain navigation link on purpose: no `download` attribute.
         On iOS Safari a `download` attribute forces a file download instead of
         opening the contact card sheet. -->
    <a class="btn" id="add" href="contact.vcf">Add to Contacts</a>
    <small>If nothing happens, tap the button above.</small>
  </main>
  <script>
    // Auto-open the vCard. Navigating (not fetching/downloading) to the .vcf
    // is what lets iOS Safari show the "Create New Contact" sheet.
    // Skipped when a user explicitly navigated here with ?stay for debugging.
    if (location.search.indexOf('stay') === -1) {
      setTimeout(function () { location.href = 'contact.vcf'; }, 400);
    }
  </script>
</body>
</html>
